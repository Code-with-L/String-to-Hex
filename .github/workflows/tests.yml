name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify icons match their generator
        run: |
          node scripts/make-icons.mjs
          git diff --exit-code -- icons/ || {
            echo "::error::icons/ is out of date — run 'npm run icons' and commit the result"
            exit 1
          }

      - name: Engine tests
        run: npm test

      - name: Project validation
        run: node scripts/validate.mjs

      - name: Static pages are up to date
        run: |
          node scripts/make-og.mjs
          node scripts/prerender.mjs
          CHANGED="$(git status --porcelain --untracked-files=all -- \
            read tool glossary units learn tools symbols tables ascii \
            notepad html-editor entities convert about sitemap.xml robots.txt icons/og.png)"
          if [ -n "$CHANGED" ]; then
            echo "::error::generated files are out of date — run 'npm run build' and commit the result"
            echo "$CHANGED"
            exit 1
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    # Pushes to main deploy automatically; a manual dispatch re-deploys the
    # current main without needing a throwaway commit.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The hash-routed app is also published as real static pages so crawlers
      # get indexable HTML at /tool/…, /read/… and /units/….
      - name: Build static pages
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # The repository has no Pages site yet; this creates it on first run.
          # Requires the workflow's `pages: write` permission, which is set above.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
